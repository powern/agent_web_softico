[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softico-wp-guardian"
version = "0.1.0"
description = "Guarded WordPress fleet audit and maintenance agent for Softico"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Softico"}]
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
wp-guardian = "wp_guardian.cli:main"
wp-guardian-maintenance = "wp_guardian.maintenance_all_plugins:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
